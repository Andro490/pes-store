server {
    listen 80;
    server_name 72.60.190.38; # أو الدومين الخاص بك مثل: pes-store.com

    # مسار ملفات الـ Frontend المترجمة (Vite build)
    root /var/www/pes-store/frontend/dist;
    index index.html;

    # توجيه صفحات React (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # توجيه طلبات الـ API إلى Backend Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # تحسين أداء الملفات الثابتة
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
