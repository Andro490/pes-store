server {
    listen 80;
    server_name pes.fouadf9.network;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pes.fouadf9.network;

    ssl_certificate /etc/letsencrypt/live/pes.fouadf9.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pes.fouadf9.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # مسار ملفات فرونت إند متجر بيس
    root /var/www/pes-store/frontend/dist;
    index index.html;

    # توجيه صفحات React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # توجيه طلبات الـ API إلى باك إند متجر بيس على بورت 5050 المستقل
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # تحسين كاش الملفات الثابتة
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
